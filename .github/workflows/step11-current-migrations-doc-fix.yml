name: Apply Current Acceptance Migration Docs

on:
  push:
    branches:
      - feat/launch-blueprint-spa
    paths:
      - .github/workflows/step11-current-migrations-doc-fix.yml

permissions:
  contents: write

concurrency:
  group: ghosttown-step11-current-migrations-doc-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/launch-blueprint-spa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update acceptance migration instructions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/GHOSTTOWN_ENVIRONMENT_ACCEPTANCE_CURSOR_CODEX_HANDOFF.md')
          text = path.read_text()

          old = '''## 7. Phase 3 — apply migrations 0002 and 0003

The migrations must run in filename order:

```text
0002_launch_blueprints.sql
0003_launch_sites.sql
```'''
          new = '''## 7. Phase 3 — apply the complete current migration chain

The current v2.1.1 acceptance environment requires the Blueprint, Launch Site, and normalized Daily Execution Log schemas. Apply all unapplied migrations in filename order:

```text
0002_launch_blueprints.sql
0003_launch_sites.sql
0004_blueprint_execution_log.sql
```

Do not mark acceptance storage ready if `0004_blueprint_execution_log.sql` is absent. The executable account Blueprint, evidence ledger, checkpoint reviews, reminders, and version-attached recovery depend on its normalized tables.'''
          if old not in text:
              raise SystemExit('Expected migration heading/list anchor not found')
          text = text.replace(old, new, 1)

          old_tables = '''Required tables:

```text
launch_blueprints
launch_blueprint_progress
launch_sites
launch_site_leads
```

Stop if any table is absent.'''
          new_tables = '''Required tables include the canonical delivery tables plus the normalized execution architecture:

```text
launch_blueprints
launch_blueprint_progress
launch_sites
launch_site_leads
accounts
blueprints
blueprint_actions
action_progress
journal_entries
journal_evidence
reminder_preferences
scheduled_reminders
checkpoint_reviews
acs_readiness_assessments
```

Stop if any required table is absent. This is a schema-presence check only; acceptance data must still be created through the real paid/customer paths.'''
          if old_tables not in text:
              raise SystemExit('Expected required-tables anchor not found')
          text = text.replace(old_tables, new_tables, 1)

          old_done = '- migrations 0002 and 0003 are applied;'
          new_done = '- migrations 0002, 0003, and 0004 are applied;'
          if old_done not in text:
              raise SystemExit('Expected Definition of Done migration anchor not found')
          text = text.replace(old_done, new_done, 1)

          path.write_text(text)
          PY
      - name: Validate current branch
        run: |
          npm ci
          npm run verify:blueprint
          npm run type-check
          npm run test
          npm run worker:check
          npm run worker:check:acceptance
          npm run build
          git diff --check
      - name: Commit migration documentation and remove bootstrap
        shell: bash
        run: |
          rm -f .github/workflows/step11-current-migrations-doc-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document complete v2.1.1 acceptance migrations"
          git push origin HEAD:feat/launch-blueprint-spa
