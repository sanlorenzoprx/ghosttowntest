name: Complete Execution Log First Layer

on:
  push:
    branches:
      - feat/launch-blueprint-spa

permissions:
  contents: write

concurrency:
  group: execution-log-first-layer-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/launch-blueprint-spa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply first-layer completion
        run: node scripts/apply-execution-log-first-layer.mjs
      - name: Remove bootstrap scaffolding
        run: rm scripts/apply-execution-log-first-layer.mjs .github/workflows/execution-log-first-layer-bootstrap.yml
      - name: Commit completed first layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete GhostTown Execution Log first layer"
          git push origin HEAD:feat/launch-blueprint-spa
