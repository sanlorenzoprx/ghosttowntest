name: Launch Blueprint v2.1 Check

on:
  push:
    branches:
      - feat/launch-blueprint-spa
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: launch-blueprint-v21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify canonical Blueprint and repository gates
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check whitespace
        run: git diff --check
