name: Acceptance

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the current commit to the Cloudflare acceptance Worker"
        required: true
        default: true
        type: boolean
      run_full_tests:
        description: "Run the full test suite before deployment"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ghosttown-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: acceptance
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GHOSTTOWN_E2E_BASE_URL: ${{ secrets.GHOSTTOWN_E2E_BASE_URL }}
      GHOSTTOWN_E2E_AUTH_TOKEN: ${{ secrets.GHOSTTOWN_E2E_AUTH_TOKEN }}
      GHOSTTOWN_E2E_GML_ORDER_ID: ${{ secrets.GHOSTTOWN_E2E_GML_ORDER_ID }}
      GHOSTTOWN_E2E_SPRINT_ORDER_ID: ${{ secrets.GHOSTTOWN_E2E_SPRINT_ORDER_ID }}
      GHOSTTOWN_E2E_SPRINT_MUTATE: ${{ vars.GHOSTTOWN_E2E_SPRINT_MUTATE || '0' }}
      GHOSTTOWN_E2E_LIVE_URL: ${{ secrets.GHOSTTOWN_E2E_LIVE_URL }}
      GHOSTTOWN_E2E_SUBMIT_LEAD: ${{ vars.GHOSTTOWN_E2E_SUBMIT_LEAD || '0' }}
      GHOSTTOWN_E2E_AGENTIC: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify required GitHub acceptance credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing acceptance environment secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing acceptance environment secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Verify current product and closeout contracts
        run: >
          npx vitest run
          tests/currentProductPromise.test.ts
          tests/strategicUncertaintySprint.test.ts
          tests/customerAccessResearch.test.ts
          tests/launchBlueprintVertexPipeline.test.ts
          tests/blueprintAssetsV21.test.ts
          tests/blueprintPdfV21.test.ts
          tests/blueprintReleaseQualityGateV21.test.ts
          tests/blueprintWebsiteEvidence.test.ts
          tests/blueprintExecutionCopilotContract.test.ts
          tests/executionLearningCoachContract.test.ts
          tests/agenticGoLiveGateContract.test.ts
          tests/launchBlueprintExecutionHomeV21.test.ts
          tests/launchBlueprintViewV21.test.ts
          --no-file-parallelism

      - name: Type check
        run: npm run type-check

      - name: Production frontend build
        run: npm run build

      - name: Acceptance Worker dry-run
        run: npm run worker:check:acceptance

      - name: Full tests
        if: ${{ inputs.run_full_tests }}
        run: npm test

      - name: Apply acceptance D1 migrations
        if: ${{ inputs.deploy }}
        run: |
          mkdir -p github-acceptance
          npx wrangler d1 migrations apply DB --env acceptance --remote 2>&1 | tee github-acceptance/migration-apply.txt

      - name: Deploy acceptance Worker
        if: ${{ inputs.deploy }}
        run: |
          mkdir -p github-acceptance
          npx wrangler deploy --env acceptance 2>&1 | tee github-acceptance/deploy.log

      - name: Build acceptance frontend against acceptance Worker
        if: ${{ inputs.deploy }}
        env:
          VITE_API_URL: https://lit-ghost-town-api-acceptance.sanlorenzoprx.workers.dev
        run: |
          rm -rf dist
          npm run build
          grep -R -F "https://lit-ghost-town-api-acceptance.sanlorenzoprx.workers.dev" dist/assets >/dev/null || {
            echo "::error::Acceptance frontend build does not contain the acceptance Worker API origin"
            exit 1
          }
          printf '%s\n' "$GITHUB_SHA" > dist/acceptance-build.txt

      - name: Deploy current acceptance frontend
        if: ${{ inputs.deploy }}
        run: |
          npx wrangler pages deploy dist --project-name ghosttown-acceptance --branch main 2>&1 | tee github-acceptance/pages-deploy.log

      - name: Verify fresh acceptance frontend deployment
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          url="https://main.ghosttown-acceptance.pages.dev/acceptance-build.txt"
          for attempt in $(seq 1 24); do
            served="$(curl -fsS -H 'Cache-Control: no-cache' "$url?sha=$expected&attempt=$attempt" 2>/dev/null || true)"
            if [ "$served" = "$expected" ]; then
              echo "Acceptance frontend serves current SHA $expected"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Acceptance frontend did not serve current SHA $expected from $url"
          exit 1

      - name: Self-provision isolated customer-journey fixture
        id: fixture
        if: ${{ inputs.deploy }}
        continue-on-error: true
        run: node scripts/acceptance-e2e-fixture.mjs

      - name: Verify self-provisioned runtime acceptance inputs
        id: runtime_inputs
        if: ${{ always() && inputs.deploy && steps.fixture.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          test -n "$GHOSTTOWN_E2E_BASE_URL"
          test -n "$GHOSTTOWN_E2E_API_URL"
          test -n "$GHOSTTOWN_E2E_AUTH_TOKEN"
          test -n "$GHOSTTOWN_E2E_FIXTURE_OWNER"
          test -n "$GHOSTTOWN_E2E_FIXTURE_PASSWORD"
          test -n "$GHOSTTOWN_E2E_SPRINT_ORDER_ID"
          test "$GHOSTTOWN_E2E_SPRINT_MUTATE" = "1"
          test "$GHOSTTOWN_E2E_AGENTIC" = "1"
          test -n "$GHOSTTOWN_E2E_GML_ORDER_ID"
          test -n "$GHOSTTOWN_E2E_LIVE_URL"
          test "$GHOSTTOWN_E2E_SUBMIT_LEAD" = "1"

      - name: Prove login, free verdict and Stripe test checkout handoff
        id: front_door
        if: ${{ always() && inputs.deploy && steps.fixture.outcome == 'success' && steps.runtime_inputs.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: timeout --foreground 6m node tests/e2e/front-door-acceptance.mjs

      - name: Prove full interactive 30-Day Sprint
        id: sprint
        if: ${{ always() && inputs.deploy && steps.fixture.outcome == 'success' && steps.runtime_inputs.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: timeout --foreground 35m node tests/e2e/30-day-sprint-acceptance.mjs

      - name: Prove live Get Me Live customer journey
        id: get_me_live
        if: ${{ always() && inputs.deploy && steps.fixture.outcome == 'success' && steps.runtime_inputs.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: timeout --foreground 10m node tests/e2e/get-me-live-acceptance.mjs

      - name: Audit Get Me Live owner controls
        id: owner_controls
        if: ${{ always() && inputs.deploy && steps.fixture.outcome == 'success' && steps.runtime_inputs.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: timeout --foreground 6m node tests/e2e/get-me-live-owner-controls.mjs

      - name: Prove Sprint remains usable without Get Me Live
        id: sprint_without_gml
        if: ${{ always() && inputs.deploy && steps.fixture.outcome == 'success' && steps.runtime_inputs.outcome == 'success' && steps.get_me_live.outcome == 'success' && steps.owner_controls.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: timeout --foreground 6m node tests/e2e/sprint-without-gml-acceptance.mjs

      - name: Aggregate agentic go-live gate
        id: go_live_gate
        if: ${{ always() && inputs.deploy }}
        continue-on-error: true
        run: node scripts/acceptance-go-live-gate-report.mjs

      - name: Clean self-provisioned acceptance fixture
        if: ${{ always() && inputs.deploy }}
        run: node scripts/acceptance-e2e-cleanup.mjs

      - name: Record acceptance execution receipt
        if: always()
        shell: bash
        env:
          DEPLOY_REQUESTED: ${{ inputs.deploy }}
          FULL_TESTS_REQUESTED: ${{ inputs.run_full_tests }}
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          RUNTIME_INPUTS_OUTCOME: ${{ steps.runtime_inputs.outcome }}
          FRONT_DOOR_OUTCOME: ${{ steps.front_door.outcome }}
          SPRINT_OUTCOME: ${{ steps.sprint.outcome }}
          GET_ME_LIVE_OUTCOME: ${{ steps.get_me_live.outcome }}
          OWNER_CONTROLS_OUTCOME: ${{ steps.owner_controls.outcome }}
          SPRINT_WITHOUT_GML_OUTCOME: ${{ steps.sprint_without_gml.outcome }}
          GO_LIVE_GATE_OUTCOME: ${{ steps.go_live_gate.outcome }}
        run: |
          mkdir -p github-acceptance
          node - <<'NODE'
          const fs = require('fs');
          const receipt = {
            schemaVersion: 'ghosttown-github-acceptance-execution-v1',
            repository: process.env.GITHUB_REPOSITORY,
            gitSha: process.env.GITHUB_SHA,
            gitRef: process.env.GITHUB_REF,
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            actor: process.env.GITHUB_ACTOR,
            environment: 'acceptance',
            deployRequested: process.env.DEPLOY_REQUESTED === 'true',
            fullTestsRequested: process.env.FULL_TESTS_REQUESTED === 'true',
            stages: {
              fixture: process.env.FIXTURE_OUTCOME || 'not_run',
              runtimeInputs: process.env.RUNTIME_INPUTS_OUTCOME || 'not_run',
              frontDoor: process.env.FRONT_DOOR_OUTCOME || 'not_run',
              sprint30Day: process.env.SPRINT_OUTCOME || 'not_run',
              getMeLive: process.env.GET_ME_LIVE_OUTCOME || 'not_run',
              ownerControls: process.env.OWNER_CONTROLS_OUTCOME || 'not_run',
              sprintWithoutGetMeLive: process.env.SPRINT_WITHOUT_GML_OUTCOME || 'not_run',
              agenticGoLiveGate: process.env.GO_LIVE_GATE_OUTCOME || 'not_run'
            },
            recordedAt: new Date().toISOString()
          };
          fs.writeFileSync('github-acceptance/execution-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Upload acceptance execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghosttown-acceptance-${{ github.run_id }}
          path: github-acceptance
          if-no-files-found: error
          retention-days: 14

      - name: Aggregate pre-live acceptance result
        if: ${{ always() && inputs.deploy }}
        shell: bash
        env:
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          RUNTIME_INPUTS_OUTCOME: ${{ steps.runtime_inputs.outcome }}
          FRONT_DOOR_OUTCOME: ${{ steps.front_door.outcome }}
          SPRINT_OUTCOME: ${{ steps.sprint.outcome }}
          GET_ME_LIVE_OUTCOME: ${{ steps.get_me_live.outcome }}
          OWNER_CONTROLS_OUTCOME: ${{ steps.owner_controls.outcome }}
          SPRINT_WITHOUT_GML_OUTCOME: ${{ steps.sprint_without_gml.outcome }}
          GO_LIVE_GATE_OUTCOME: ${{ steps.go_live_gate.outcome }}
        run: |
          echo "fixture: $FIXTURE_OUTCOME"
          echo "runtime-inputs: $RUNTIME_INPUTS_OUTCOME"
          echo "front-door: $FRONT_DOOR_OUTCOME"
          echo "sprint-30-day: $SPRINT_OUTCOME"
          echo "get-me-live: $GET_ME_LIVE_OUTCOME"
          echo "owner-controls: $OWNER_CONTROLS_OUTCOME"
          echo "sprint-without-gml: $SPRINT_WITHOUT_GML_OUTCOME"
          echo "agentic-go-live-gate: $GO_LIVE_GATE_OUTCOME"
          failed=0
          for outcome in "$FIXTURE_OUTCOME" "$RUNTIME_INPUTS_OUTCOME" "$FRONT_DOOR_OUTCOME" "$SPRINT_OUTCOME" "$GET_ME_LIVE_OUTCOME" "$OWNER_CONTROLS_OUTCOME" "$SPRINT_WITHOUT_GML_OUTCOME" "$GO_LIVE_GATE_OUTCOME"; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Pre-live acceptance is BLOCKED. Inspect the stage receipts and logs above."
            exit 1
          fi
          echo "Pre-live acceptance stages all passed."
