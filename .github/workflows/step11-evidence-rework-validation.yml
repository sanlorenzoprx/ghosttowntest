name: Step 11 Evidence Rework Validation

on:
  push:
    branches:
      - work/step11-evidence-sufficiency

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Focused evidence tests
        run: npx vitest run tests/researchEvidenceSufficiency.test.ts tests/adaptiveResearch.test.ts tests/blueprintReleaseQualityGateV21.test.ts tests/researchOutcomeRouting.test.ts --no-file-parallelism
      - name: Autopilot invariant checks
        run: |
          node scripts/sprint-autopilot/step-09-adaptive-research.mjs
          node --check scripts/sprint-autopilot/step-11-ready-sprint.mjs
          node --check scripts/sprint-autopilot/step-11-audit-ready-artifacts.mjs
          node --check scripts/fresh-sprint-acceptance.mjs
          node scripts/sprint-generation-autopilot.mjs --plan
