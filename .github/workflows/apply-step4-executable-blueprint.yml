name: Apply Step 4 Executable Blueprint

on:
  push:
    branches:
      - feat/launch-blueprint-spa

permissions:
  contents: write

concurrency:
  group: ghosttown-step4-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/launch-blueprint-spa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply executable Blueprint patch
        run: node scripts/apply-step4-executable-blueprint.mjs
      - name: Commit Step 4 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish executable Blueprint v2.1 account surface"
          git push origin HEAD:feat/launch-blueprint-spa
