name: CI

on:
  pull_request:
    branches:
      - main
      - feat/launch-blueprint-spa
  push:
    branches:
      - main
      - feat/launch-blueprint-spa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonical Blueprint verification
        run: npm run verify:blueprint

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test
        env:
          CI: "true"

      - name: Cloudflare Worker check
        run: npm run worker:check

      - name: Acceptance Worker dry-run
        run: npm run worker:check:acceptance

      - name: Production build
        run: npm run build

      - name: Repository diff check
        run: git diff --check
