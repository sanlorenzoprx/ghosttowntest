name: Bootstrap Blueprint v2.1.1 Correction

on:
  push:
    branches:
      - feat/launch-blueprint-spa

permissions:
  contents: write

concurrency:
  group: blueprint-v211-bootstrap-recovery
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/launch-blueprint-spa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact correction payload when present
        shell: bash
        run: |
          if [[ -f scripts/apply-blueprint-v211-correction.mjs ]]; then
            node scripts/apply-blueprint-v211-correction.mjs
          fi
      - name: Remove recovery workflow and commit reconstructed files
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap-blueprint-v211.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reconcile Vertex pipeline with Blueprint v2.1.1"
          git push origin HEAD:feat/launch-blueprint-spa
