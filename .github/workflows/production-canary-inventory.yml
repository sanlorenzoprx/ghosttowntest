name: Production Canary Inventory

on:
  push:
    branches:
      - test/autonomous-production-customer-journey
    paths:
      - .github/workflows/production-canary-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    name: read-only-production-canary-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_RELEASE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Query live production canary candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-canary-inventory
          npx wrangler d1 execute ghosttowntest-blueprints --env production --remote --json --command "
            SELECT
              g.owner_id,
              g.order_id AS gml_order_id,
              g.source_sprint_order_id,
              g.status AS gml_status,
              g.public_url,
              g.custom_domain,
              g.updated_at,
              b.status AS sprint_status
            FROM get_me_live_orders g
            LEFT JOIN launch_blueprints b
              ON b.order_id = g.source_sprint_order_id
             AND b.owner_id = g.owner_id
            WHERE g.status = 'live'
              AND b.status = 'ready'
            ORDER BY g.updated_at DESC
            LIMIT 100;
          " > production-canary-inventory/raw.json
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('production-canary-inventory/raw.json','utf8'));
          const rows = Array.isArray(raw) ? (raw[0]?.results || raw[0]?.result || []) : (raw?.results || []);
          const maskEmail = value => {
            const text = String(value || '').toLowerCase();
            const [local, domain] = text.split('@');
            if (!domain) return 'invalid';
            const head = local.slice(0, Math.min(2, local.length));
            const tail = local.length > 3 ? local.slice(-1) : '';
            return head + '***' + tail + '@' + domain;
          };
          const looksSynthetic = value => /test|e2e|accept|canary|qa|ghosttown|demo|sandbox/i.test(String(value || ''));
          const candidates = rows.filter(row => looksSynthetic(row.owner_id)).map(row => ({
            ownerHint: maskEmail(row.owner_id),
            gmlOrderId: row.gml_order_id,
            sprintOrderId: row.source_sprint_order_id,
            gmlStatus: row.gml_status,
            sprintStatus: row.sprint_status,
            liveUrl: row.custom_domain ? 'https://' + row.custom_domain : row.public_url,
            updatedAt: row.updated_at
          }));
          const out = { totalReadyLivePairs: rows.length, syntheticLookingPairs: candidates.length, candidates };
          fs.writeFileSync('production-canary-inventory/inventory.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Upload masked inventory
        uses: actions/upload-artifact@v4
        with:
          name: ghosttown-production-canary-inventory-${{ github.run_id }}
          path: production-canary-inventory/inventory.json
          if-no-files-found: error
          retention-days: 7
