name: Apply Step 6 Vertex Acceptance Docs

on:
  push:
    branches:
      - feat/launch-blueprint-spa
    paths:
      - .github/workflows/step6-vertex-acceptance-docs-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: ghosttown-step6-vertex-acceptance-docs
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/launch-blueprint-spa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch acceptance documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected anchor: {label}")
              return text.replace(old, new, 1)

          # 1) Environment acceptance handoff
          path = Path('docs/GHOSTTOWN_ENVIRONMENT_ACCEPTANCE_CURSOR_CODEX_HANDOFF.md')
          text = path.read_text()
          text = replace_once(text,
          '''DISTRIBUTION_FOOTPRINT_BATCH_SIZE = "3"\nFRONTEND_URL = "REPLACE_AFTER_PAGES_ACCEPTANCE_DEPLOY"''',
          '''DISTRIBUTION_FOOTPRINT_BATCH_SIZE = "3"\nVERTEX_BLUEPRINT_REQUIRED = "true"\nVERTEX_PROJECT_ID = "REPLACE_WITH_VERTEX_PROJECT_ID"\nVERTEX_LOCATION = "us-central1"\nVERTEX_BLUEPRINT_MODEL = "gemini-2.5-flash"\nFRONTEND_URL = "REPLACE_AFTER_PAGES_ACCEPTANCE_DEPLOY"''',
          'acceptance vars')

          text = replace_once(text,
          '''## 8. Phase 4 — configure acceptance secrets privately\n\nUse Stripe **test/sandbox** credentials only in the acceptance environment.\n\nRequired secrets from the current `Env` contract:\n\n```text\nJWT_SECRET\nSTRIPE_SECRET_KEY\nSTRIPE_WEBHOOK_SECRET\nSTRIPE_PRICE_ID\nSTRIPE_PAID_TEST_PRICE_ID\nSTRIPE_30_DAY_PLAN_PRICE_ID\nLIT_API_KEY, if the verdict/video path requires it\nGEMINI_API_KEY\nDATAFORSEO_LOGIN\nDATAFORSEO_PASSWORD\nPODCAST_INDEX_API_KEY\nPODCAST_INDEX_API_SECRET\nYOUTUBE_API_KEY\nINTERNAL_RESEARCH_OWNER_EMAILS\n```''',
          '''## 8. Phase 4 — configure Vertex identity and acceptance secrets privately\n\nUse Stripe **test/sandbox** credentials only in the acceptance environment. The paid acceptance run must exercise the staged Vertex Blueprint path, so do not rely on implicit Vertex defaults.\n\n### Non-secret Vertex environment variables\n\nThese values identify the intended Vertex runtime and belong in `[env.acceptance.vars]`:\n\n```text\nVERTEX_BLUEPRINT_REQUIRED=true\nVERTEX_PROJECT_ID\nVERTEX_LOCATION\nVERTEX_BLUEPRINT_MODEL\n```\n\n`VERTEX_BLUEPRINT_REQUIRED` must be explicitly `true` for the release acceptance run. Record the exact project, location, and model used.\n\n### Cloudflare secrets\n\nOnly the service-account private key is inherently secret, but keep all service-account identity fields in the Cloudflare secret store to reduce accidental exposure in config, screenshots, and logs.\n\n```text\nVERTEX_SERVICE_ACCOUNT_EMAIL\nVERTEX_SERVICE_ACCOUNT_PRIVATE_KEY\nVERTEX_SERVICE_ACCOUNT_PRIVATE_KEY_ID\nJWT_SECRET\nSTRIPE_SECRET_KEY\nSTRIPE_WEBHOOK_SECRET\nSTRIPE_PRICE_ID\nSTRIPE_PAID_TEST_PRICE_ID\nSTRIPE_30_DAY_PLAN_PRICE_ID\nLIT_API_KEY, if the verdict/video path requires it\nGEMINI_API_KEY\nDATAFORSEO_LOGIN\nDATAFORSEO_PASSWORD\nPODCAST_INDEX_API_KEY\nPODCAST_INDEX_API_SECRET\nYOUTUBE_API_KEY\nINTERNAL_RESEARCH_OWNER_EMAILS\n```''',
          'phase 4 classification')

          text = replace_once(text,
          '''```powershell\nnpx wrangler secret put JWT_SECRET --env acceptance''',
          '''```powershell\nnpx wrangler secret put VERTEX_SERVICE_ACCOUNT_EMAIL --env acceptance\nnpx wrangler secret put VERTEX_SERVICE_ACCOUNT_PRIVATE_KEY --env acceptance\nnpx wrangler secret put VERTEX_SERVICE_ACCOUNT_PRIVATE_KEY_ID --env acceptance\nnpx wrangler secret put JWT_SECRET --env acceptance''',
          'vertex secret commands')

          text = replace_once(text,
          '''The receipt must contain names only, never values.''',
          '''The secret inventory must contain names only, never values. Never record the Vertex private key, generated JWT assertion, OAuth access token, Stripe secret, webhook signing secret, or any other credential value.''',
          'secret receipt rule')

          text = replace_once(text,
          '''### Gemini\n\nVerify:\n\n- model returns valid structured output;\n- it can select only supplied candidate IDs;\n- an invented ID is rejected.\n\nRecord only normalized outputs and error summaries. Never record credentials or complete raw provider payloads.''',
          '''### Gemini research selection\n\nVerify:\n\n- model returns valid structured output;\n- supplied candidate IDs remain advisory selection references rather than evidence;\n- an unknown model-selected ID is discarded and the network is recovered only from provider-verified candidates, or the research run fails if canonical outcomes cannot be satisfied.\n\n### Vertex Blueprint generation\n\nVerify:\n\n- service-account OAuth succeeds without logging the assertion or access token;\n- the configured project, location, and model match the acceptance environment;\n- exactly four ordered stage receipts exist: evidence normalization, strategy synthesis, asset generation, and red-team review;\n- the red-team result passes with no blocking finding;\n- the generation evidence records the normalized input SHA-256 and, after persistence, the exact canonical Blueprint SHA-256;\n- no private key, access token, raw prompt, or raw model response enters customer artifacts or the acceptance receipt.\n\nRecord only normalized outputs, receipt-safe identifiers/hashes, and error summaries. Never record credentials or complete raw provider payloads.''',
          'provider smoke Vertex')

          text = replace_once(text,
          '''### Workflow and generation\n\nVerify:\n\n1. DataForSEO, Podcast Index, and YouTube tasks execute.\n2. At least two provider types succeed.\n3. At least ten verified candidates exist before selection.\n4. Gemini selects only candidate IDs supplied to it.\n5. Final network contains 10–25 targets across at least three target categories.\n6. Order progresses to `generating` and then `ready`.\n7. Incomplete research never becomes `ready`.\n\nRecord the Workflow instance ID and state transitions.''',
          '''### Workflow and generation\n\nVerify:\n\n1. Required DataForSEO, Podcast Index, YouTube, and original-source verification tasks execute.\n2. At least ten verified candidates exist before selection.\n3. Research covers at least three independent verification dimensions of the business idea; provider count and content/channel category diversity are diagnostic, not release quotas.\n4. Unknown model-selected candidate IDs are never treated as evidence or delivered unless independently researched and verified.\n5. Final customer-access network contains 10–25 verified targets with all required source and execution metadata.\n6. `VERTEX_BLUEPRINT_REQUIRED=true` is effective for the acceptance Worker.\n7. Vertex runs exactly four ordered stages and the red-team gate passes with no blocking finding.\n8. The generation receipt records Vertex project ID, location, configured model, four stage receipts, normalized input SHA-256, and exact canonical Blueprint SHA-256.\n9. Order progresses to `generating` and then `ready` only after the full release and delivery gates pass.\n10. Incomplete research, failed Vertex generation, failed red-team review, or missing receipt integrity never becomes `ready`.\n\nRecord the Workflow instance ID and state transitions.''',
          'workflow generation acceptance')

          receipt_old = '''Required sections:\n\n```text\nRepository and branch\nFinal commit SHA\nGitHub Actions run and conclusion\nCloudflare account identity (non-secret)\nAcceptance Worker URL\nAcceptance frontend URL\nKV namespace title and ID\nD1 database name and ID\nApplied migration list\nPrivate R2 bucket name\nWorkflow name and instance ID\nConfigured secret names\nStripe test Checkout Session ID\nStripe test event ID\nGhostTown order ID\nConfirmed seed domains\nProvider task counts\nVerified candidate count\nFinal target count and categories\nBlueprint ID and schema\nD1 persistence verification\nR2 PDF key verification\nR2 JSON key verification\nR2 ZIP key verification\nPDF visual inspection result\nZIP manifest result\nPublic Launch Site URL\nLead capture result\nLead CSV export result\nAccount recovery result\nCross-account denial matrix\nForced provider failure result\nForced storage failure result\nRetry result\nMobile visual inspection result\nDesktop visual inspection result\nProduction domain decision\nRemaining blockers\nOwner approval\n```'''
          receipt_new = '''Keep the receipt concise. Record only evidence needed to reproduce the environment, prove the paid path, verify customer deliverables, or authorize release. Do not duplicate raw logs that already exist in `.acceptance-receipts`.\n\nRequired sections:\n\n```text\n1. Build identity\n- Repository, branch, final commit SHA\n- GitHub Actions run and conclusion\n\n2. Acceptance environment identity\n- Cloudflare account identity (non-secret)\n- Acceptance Worker URL and frontend URL\n- KV namespace title/ID, D1 database name/ID, applied migrations, private R2 bucket name\n- Workflow name and instance ID\n- Configured secret names only\n- Vertex project ID, location, configured model\n- Vertex service-account email identifier and key ID\n\n3. Paid-path and generation proof\n- Stripe test Checkout Session ID and event ID\n- GhostTown order ID and confirmed seed domains\n- Provider tasks attempted/succeeded, verified candidate count, and independent evidence-dimension count/set\n- Vertex stage receipt count (must be 4) and red-team result\n- Normalized input SHA-256 and exact canonical Blueprint SHA-256\n- Blueprint ID/schema and D1 persistence verification\n\n4. Customer-delivery proof\n- PDF/JSON/ZIP persistence, hash-match, and repeat-download result\n- PDF visual inspection and ZIP manifest result\n- Public Launch Site URL, lead capture, and lead CSV export result\n- Account recovery and cross-account denial result\n\n5. Resilience and release decision\n- Provider/storage failure-and-retry matrix, including no second charge and no false `ready`\n- Mobile/desktop visual acceptance result\n- Production domain decision\n- Remaining blockers\n- Owner approval\n```\n\nDo **not** copy the private key, generated JWT assertion, OAuth access token, provider raw payloads, raw prompts, or secret values into the receipt. Individual stage prompt/response hashes are already preserved in the generation receipt and do not need to be duplicated here unless investigating a failure.'''
          text = replace_once(text, receipt_old, receipt_new, 'acceptance receipt template')

          text = text.replace('- Gemini introduces an unknown candidate;','- an unknown model-selected candidate is treated as verified evidence or delivered instead of being discarded/recovered;')
          text = replace_once(text,
          '''- provider research and original-source verification pass;\n- quality gates pass with real data;''',
          '''- provider research and original-source verification pass;\n- the acceptance Worker explicitly requires Vertex and the four-stage Vertex pipeline, red-team result, project/location/model identity, and canonical input/output hashes are recorded;\n- quality gates pass with real data;''',
          'definition of done Vertex')
          path.write_text(text)

          # 2) Deployment guide
          path = Path('docs/LAUNCH_BLUEPRINT_V2_DEPLOYMENT.md')
          text = path.read_text()
          text = replace_once(text,
          '''7. Gemini 2.5 Flash to classify and prioritize only immutable verified candidate IDs.\n8. A strict quality gate requiring 10-25 targets across at least three target types.''',
          '''7. Gemini research selection to rank verified provider candidates without turning model references into evidence.\n8. Vertex AI staged Blueprint generation using evidence normalization, strategy synthesis, asset generation, and an independent red-team review.\n9. A strict release gate requiring 10-25 verified targets plus at least three independent verification dimensions of the business idea.''',
          'deployment product boundary')

          text = replace_once(text,
          '''```powershell\nnpx wrangler secret put GEMINI_API_KEY --env production''',
          '''```powershell\nnpx wrangler secret put VERTEX_SERVICE_ACCOUNT_EMAIL --env production\nnpx wrangler secret put VERTEX_SERVICE_ACCOUNT_PRIVATE_KEY --env production\nnpx wrangler secret put VERTEX_SERVICE_ACCOUNT_PRIVATE_KEY_ID --env production\nnpx wrangler secret put GEMINI_API_KEY --env production''',
          'deployment Vertex secrets')

          text = replace_once(text,
          '''Keep these non-secret variables:\n\n```toml\nGEMINI_RESEARCH_MODEL = "gemini-2.5-flash"''',
          '''Only the service-account private key is inherently secret, but keep the service-account email and key ID in the Cloudflare secret store with it to reduce accidental exposure. Never record the private key, signed JWT assertion, or OAuth access token.\n\nKeep these non-secret variables:\n\n```toml\nVERTEX_BLUEPRINT_REQUIRED = "true"\nVERTEX_PROJECT_ID = "REPLACE_WITH_VERTEX_PROJECT_ID"\nVERTEX_LOCATION = "us-central1"\nVERTEX_BLUEPRINT_MODEL = "gemini-2.5-flash"\nGEMINI_RESEARCH_MODEL = "gemini-2.5-flash"''',
          'deployment Vertex vars')

          text = replace_once(text,
          '''- at least four provider tasks successful;\n- at least two provider types successful;\n- at least ten verified candidates before selection;\n- 10-25 final distribution targets;\n- at least three final target types;''',
          '''- required provider and original-source verification tasks executed;\n- at least ten verified candidates before selection;\n- at least three independent verification dimensions of the business idea;\n- 10-25 final verified distribution targets;''',
          'deployment research gate')
          text = text.replace('- every target is selected from an immutable provider candidate ID;\n- Gemini cannot introduce a new target, URL, metric, rule, or contact.',
          '- unknown model-selected candidate references are discarded/recovered from provider-verified research and never treated as evidence by themselves;\n- Gemini cannot introduce a delivered target, URL, metric, rule, or contact without independent verification.')

          text = replace_once(text,
          '''### Gemini\n\nConfirm `gemini-2.5-flash` returns valid structured JSON and selects only candidate IDs present in the request. A malformed or invented candidate must fail the quality gate.''',
          '''### Gemini research selection\n\nConfirm the configured Gemini research model returns valid structured JSON. Unknown candidate references must be ignored and recovered only from provider-verified candidates; the order fails only when the canonical research outcomes cannot be satisfied.\n\n### Vertex Blueprint generation\n\nFor acceptance and production, explicitly configure `VERTEX_BLUEPRINT_REQUIRED=true`, the intended project, location, and model, plus the service-account email/private key/key ID in Cloudflare secrets. Confirm OAuth succeeds, exactly four ordered stage receipts are produced, the red-team review passes with no blocking finding, and the generation evidence contains the normalized input SHA-256 and exact canonical Blueprint SHA-256. Never log or record the private key, signed JWT assertion, or OAuth access token.''',
          'deployment Vertex acceptance')

          text = text.replace('7. Confirm the final network contains 10-25 targets across at least three categories.',
          '7. Confirm the final network contains 10-25 verified targets and the research/intake evidence spans at least three independent verification dimensions of the idea.')
          text = replace_once(text,
          '''10. Confirm the professional PDF contains the same proof and execution instructions.''',
          '''10. Confirm the staged Vertex Blueprint pipeline produces exactly four ordered receipts, a passing red-team result, the configured project/location/model identity, normalized input SHA-256, and exact canonical Blueprint SHA-256.\n11. Confirm the professional PDF contains the same proof and execution instructions.''',
          'deployment full acceptance Vertex')
          # Renumber remaining full-acceptance items after the inserted step.
          for old, new in [('11. Confirm offer,', '12. Confirm offer,'), ('12. Confirm progress,', '13. Confirm progress,'), ('13. Confirm JSON', '14. Confirm JSON'), ('14. Force one provider', '15. Force one provider'), ('15. Open `/internal-research`', '16. Open `/internal-research`')]:
              text = text.replace(old, new)
          text = replace_once(text,
          '''- the complete Stripe test-mode acceptance run is recorded;\n- the generated board-game Media & Distribution Network and PDF are manually inspected for real customer value;''',
          '''- the complete Stripe test-mode acceptance run is recorded;\n- the acceptance receipt records Vertex project/location/model, service-account email identifier/key ID, four-stage receipt count, red-team result, normalized input SHA-256, and exact canonical Blueprint SHA-256 without recording any private key or token;\n- the generated board-game Media & Distribution Network and PDF are manually inspected for real customer value;''',
          'deployment release Vertex receipt')
          path.write_text(text)

          # 3) Acceptance fixture
          path = Path('docs/launch-blueprint-v2-acceptance.md')
          text = path.read_text()
          text = text.replace('6. Ten to twenty-five current, sourced Media & Distribution targets across at least three target types.',
          '6. Ten to twenty-five current, sourced Media & Distribution targets, backed by at least three independent verification dimensions of the business idea; provider/content-category diversity is diagnostic rather than a release quota.')

          vertex_env = '''## Vertex environment contract acceptance\n\nThe isolated paid acceptance Worker must explicitly configure the Vertex Blueprint environment instead of relying on defaults.\n\nNon-secret environment variables:\n\n```text\nVERTEX_BLUEPRINT_REQUIRED=true\nVERTEX_PROJECT_ID\nVERTEX_LOCATION\nVERTEX_BLUEPRINT_MODEL\n```\n\nCloudflare secrets:\n\n```text\nVERTEX_SERVICE_ACCOUNT_EMAIL\nVERTEX_SERVICE_ACCOUNT_PRIVATE_KEY\nVERTEX_SERVICE_ACCOUNT_PRIVATE_KEY_ID\n```\n\nOnly the private key is inherently secret, but the email and key ID stay in the secret store to reduce accidental exposure. The acceptance receipt records the project ID, location, model, service-account email identifier, and key ID, but never the private key, signed JWT assertion, or OAuth access token.\n\n'''
          text = replace_once(text, '## Staged Vertex generation acceptance\n\n', vertex_env + '## Staged Vertex generation acceptance\n\n', 'acceptance Vertex env section')
          text = replace_once(text,
          '''8. The generation receipt contains four ordered stage receipts with model, prompt hash, response hash, token counts when available, response ID when available, and completion time.\n9. Raw prompts, provider payloads, OAuth tokens, service-account keys, and owner-only research never enter the customer record.\n10. Dashboard, PDF, ZIP, Launch Site, calendar, sources, and progress all render from the same validated canonical record.\n\nAn environment that explicitly sets `VERTEX_BLUEPRINT_REQUIRED=false` may use the deterministic v2.1 generator, but its receipt must record that the staged Vertex pipeline was skipped and why.''',
          '''8. The generation receipt contains exactly four ordered stage receipts with model, prompt hash, response hash, token counts when available, response ID when available, and completion time.\n9. The public generation evidence records the configured Vertex project ID, location, model, normalized input SHA-256, and—after exact-byte persistence—the canonical Blueprint SHA-256.\n10. The acceptance receipt records the service-account email identifier and key ID for credential traceability, but never the private key, signed JWT assertion, or OAuth access token.\n11. Raw prompts, provider payloads, OAuth tokens, service-account keys, and owner-only research never enter the customer record.\n12. Dashboard, PDF, ZIP, Launch Site, calendar, sources, and progress all render from the same validated canonical record.\n\nAn environment that explicitly sets `VERTEX_BLUEPRINT_REQUIRED=false` may use the deterministic v2.1 generator for development or isolated deterministic tests, but that mode does **not** satisfy paid environment acceptance. The acceptance Worker must explicitly require Vertex.''',
          'acceptance staged receipt requirements')
          text = replace_once(text,
          '''- one complete Stripe test-mode board-game order passes the entire flow;\n- the actual PDF is visually reviewed;''',
          '''- one complete Stripe test-mode board-game order passes the entire flow with `VERTEX_BLUEPRINT_REQUIRED=true`;\n- the acceptance receipt records Vertex project/location/model, service-account email identifier/key ID, four-stage receipt count, passing red-team result, normalized input SHA-256, and exact canonical Blueprint SHA-256;\n- the actual PDF is visually reviewed;''',
          'acceptance final release Vertex')
          path.write_text(text)
          PY
      - name: Validate documentation slice
        run: |
          npm ci
          npm run verify:blueprint
          npm run type-check
          npm run test
          npm run worker:check
          npm run build
          git diff --check
      - name: Commit Step 6 docs and remove bootstrap workflow
        shell: bash
        run: |
          rm -f .github/workflows/step6-vertex-acceptance-docs-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Document Vertex v2.1 acceptance contract"
          git push origin HEAD:feat/launch-blueprint-spa
