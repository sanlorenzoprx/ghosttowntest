name: Apply Step 5 Release Gate

on:
  push:
    branches:
      - feat/launch-blueprint-spa
    paths:
      - scripts/.step5-release-gate-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/launch-blueprint-spa
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Revalidate canonical Blueprint
        run: npm run verify:blueprint
      - name: Apply Step 5 release gate
        run: node scripts/apply-step5-release-gate.mjs
      - name: Type check
        run: npm run type-check
      - name: Tests
        run: npm run test
      - name: Cloudflare Worker check
        run: npm run worker:check
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit Step 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/blueprintReleaseQualityGateV21.ts src/api/blueprintFulfillmentV21.ts src/api/distributionFootprintResearch.ts tests/blueprintReleaseQualityGateV21.test.ts docs/receipts/GHOSTTOWN_LAUNCH_BLUEPRINT_STEP5_RELEASE_QUALITY_GATE_RECEIPT.md
          git commit -m "Strengthen v2.1 release quality gate"
          git push origin HEAD:feat/launch-blueprint-spa
