name: Acceptance Customer Journey

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/acceptance-customer-journey.yml"
      - "scripts/acceptance-customer-journey.cjs"\n      - "scripts/acceptance-paid-customer-journey.cjs"
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: acceptance-customer-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-journey:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iPhone Safari
            device: iPhone 13
            engine: webkit
            slug: iphone-safari
          - label: Large iPhone Safari
            device: iPhone 13 Pro Max
            engine: webkit
            slug: iphone-large-safari
          - label: Android Chrome
            device: Pixel 5
            engine: chromium
            slug: android-chrome
          - label: iPad Safari
            device: iPad Mini
            engine: webkit
            slug: ipad-safari
          - label: Desktop Chrome
            device: Desktop 1366
            engine: chromium
            slug: desktop-chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run clean acceptance customer journey
        run: node scripts/acceptance-customer-journey.cjs
        env:
          CI: "true"
          GHOSTTOWN_ACCEPTANCE_URL: "https://ghosttown-acceptance.pages.dev/"
          DEVICE_PROFILE: "${{ matrix.device }}"
          BROWSER_ENGINE: "${{ matrix.engine }}"
          ARTIFACT_SLUG: "${{ matrix.slug }}"

      - name: Upload customer journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.slug }}
          path: artifacts/customer-journey/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 7

  paid-customer-journey:
    name: Desktop Chrome paid journey
    needs: customer-journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run paid acceptance customer journey
        run: node scripts/acceptance-paid-customer-journey.cjs
        env:
          CI: "true"
          GHOSTTOWN_ACCEPTANCE_URL: "https://ghosttown-acceptance.pages.dev/"
          STRIPE_TEST_CARD_NUMBER: "${{ secrets.STRIPE_TEST_CARD_NUMBER }}"
          STRIPE_TEST_EXPIRY: "${{ secrets.STRIPE_TEST_EXPIRY }}"
          STRIPE_TEST_CVC: "${{ secrets.STRIPE_TEST_CVC }}"
          STRIPE_TEST_POSTAL: "${{ secrets.STRIPE_TEST_POSTAL }}"
      - name: Upload paid journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-paid-desktop
          path: artifacts/paid-customer-journey
          if-no-files-found: warn
          retention-days: 7
