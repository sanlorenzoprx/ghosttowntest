name: Acceptance Customer Journey

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/acceptance-customer-journey.yml"
      - "scripts/acceptance-customer-journey.cjs"
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: acceptance-customer-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-journey:
    name: clean customer to paid boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run clean acceptance customer journey
        run: node scripts/acceptance-customer-journey.cjs
        env:
          CI: "true"
          GHOSTTOWN_ACCEPTANCE_URL: "https://ghosttown-acceptance.pages.dev/"

      - name: Upload customer journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-customer-journey
          path: artifacts/customer-journey
          if-no-files-found: warn
          retention-days: 7
