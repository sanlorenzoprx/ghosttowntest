name: Production Build Failure Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - chore/production-release-gate

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: acceptance
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUILD_UUID: 4c0928fd-c80e-4279-8cd4-dbff3048433a
    steps:
      - name: Inspect Cloudflare build and production deployment
        shell: bash
        run: |
          node - <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const buildId = process.env.BUILD_UUID;
          const headers = { Authorization: `Bearer ${token}` };
          async function cf(path) {
            const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            const b = await r.json();
            if (!r.ok || b.success === false) throw new Error(`${path} failed ${r.status}: ${JSON.stringify(b.errors || b)}`);
            return b.result;
          }
          const scripts = await cf(`/accounts/${account}/workers/scripts`);
          const worker = scripts.find(x => x.id === 'lit-ghost-town-api-production');
          if (!worker?.tag) throw new Error('Production worker tag not found');
          const build = await cf(`/accounts/${account}/builds/builds/${buildId}`);
          const logs = await cf(`/accounts/${account}/builds/builds/${buildId}/logs`);
          const deploy = await cf(`/accounts/${account}/workers/scripts/lit-ghost-town-api-production/deployments`);
          const lines = (logs.lines || []).map(row => Array.isArray(row) ? row[row.length - 1] : row).map(String);
          const safe = lines.filter(line =>
            /error|fail|wrangler|version|deploy|permission|unauthor|token|secret|config/i.test(line)
          ).slice(-80);
          console.log('BUILD_STATUS=' + JSON.stringify({
            build_uuid: buildId,
            outcome: build.build_outcome,
            branch: build.build_trigger_metadata?.branch,
            deploy_command: build.build_trigger_metadata?.deploy_command,
            build_command: build.build_trigger_metadata?.build_command,
            commit_hash: build.build_trigger_metadata?.commit_hash
          }));
          console.log('BUILD_LOG_SAFE=' + JSON.stringify(safe));
          console.log('PRODUCTION_DEPLOYMENT=' + JSON.stringify((deploy || []).slice(0,3).map(d => ({
            id: d.id,
            source: d.source,
            created_on: d.created_on,
            versions: d.versions
          }))));
          NODE
