name: Production Version Annotation Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - chore/production-release-gate

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: acceptance
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect newest production Worker versions
        shell: bash
        run: |
          node - <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/lit-ghost-town-api-production/versions`, { headers });
          const b = await r.json();
          if (!r.ok || b.success === false) throw new Error(JSON.stringify(b.errors || b));
          const rows = Array.isArray(b.result) ? b.result : (b.result?.items || b.result?.versions || []);
          const slim = rows.map(v => ({
            id: v.id,
            number: v.number,
            created_on: v.metadata?.created_on || v.created_on,
            annotations: v.annotations || v.metadata?.annotations || {}
          }));
          console.log('NEWEST_VERSION_ANNOTATIONS=' + JSON.stringify(slim.slice(-12)));
          NODE
