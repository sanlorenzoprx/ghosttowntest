name: Production Read-Only Sanity Check

on:
  push:
    branches:
      - chore/production-release-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: acceptance
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect live production state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --env production --remote | tee migrations.txt
          npx wrangler deployments status --env production --json > deployment.json
          npx wrangler versions list --env production --json > versions.json
          node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('deployment.json','utf8'));
          const v = JSON.parse(fs.readFileSync('versions.json','utf8'));
          const live = (d.versions || []).filter(x => Number(x.percentage) === 100);
          if (live.length !== 1) throw new Error('Expected exactly one 100% production version.');
          console.log('PRODUCTION_SANITY=' + JSON.stringify({
            deployment_id: d.id,
            active_version_id: live[0].version_id,
            active_percentage: live[0].percentage,
            newest_uploaded_version_id: v[0]?.id || null,
            newest_uploaded_annotations: v[0]?.annotations || {}
          }));
          NODE
          grep -Fq '0010_get_me_live_hosting_releases.sql' migrations.txt || {
            echo "::error::Expected migration 0010 to remain pending before deliberate migration run.";
            exit 1;
          }
