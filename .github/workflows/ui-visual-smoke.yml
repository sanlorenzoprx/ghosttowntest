name: Production Version Metadata Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - chore/production-release-gate

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: acceptance
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIOUS_VERSION_ID: 7c9a1db4-c3d2-473f-98ee-9e905c10b4d3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect versions and deployment
        shell: bash
        run: |
          npx wrangler versions list --env production --json > versions.json
          npx wrangler deployments status --env production --json > deployment.json
          node - <<'NODE'
          const fs = require('node:fs');
          const versions = JSON.parse(fs.readFileSync('versions.json','utf8'));
          const deployment = JSON.parse(fs.readFileSync('deployment.json','utf8'));
          console.log('VERSION_METADATA=' + JSON.stringify(versions.slice(0,8).map(v => ({
            id: v.id,
            number: v.number,
            metadata: v.metadata,
            annotations: v.annotations
          }))));
          console.log('ACTIVE_DEPLOYMENT=' + JSON.stringify(deployment));
          const live = (deployment.versions || []).filter(v => Number(v.percentage) === 100);
          if (live.length !== 1 || live[0].version_id !== process.env.PREVIOUS_VERSION_ID) {
            throw new Error('Production traffic changed unexpectedly.');
          }
          console.log('TRAFFIC_UNCHANGED=' + JSON.stringify({
            version_id: live[0].version_id,
            percentage: live[0].percentage
          }));
          NODE
