name: Production Schema Drift Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - chore/production-release-gate

permissions:
  contents: read

jobs:
  production-schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: acceptance
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect production schema state
        shell: bash
        run: |
          mkdir -p github-production-schema
          npx wrangler d1 execute DB --env production --remote --json \
            --command "PRAGMA table_info(get_me_live_orders);" \
            > github-production-schema/orders-columns.json
          npx wrangler d1 execute DB --env production --remote --json \
            --command "SELECT name, sql FROM sqlite_master WHERE name IN ('get_me_live_releases','get_me_live_publish_attempts') ORDER BY name;" \
            > github-production-schema/release-tables.json
          npx wrangler d1 execute DB --env production --remote --json \
            --command "SELECT COUNT(*) AS get_me_live_order_count FROM get_me_live_orders;" \
            > github-production-schema/order-count.json
          node - <<'NODE'
          const fs = require('node:fs');
          const load = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const unwrap = value => {
            const outer = Array.isArray(value) ? value[0] : value;
            return outer?.results || outer?.result?.[0]?.results || [];
          };
          const columns = unwrap(load('github-production-schema/orders-columns.json')).map(x => x.name);
          const tables = unwrap(load('github-production-schema/release-tables.json')).map(x => x.name);
          const count = unwrap(load('github-production-schema/order-count.json'))[0]?.get_me_live_order_count ?? null;
          console.log('PRODUCTION_SCHEMA=' + JSON.stringify({
            has_hosting_json: columns.includes('hosting_json'),
            has_custom_domain_json: columns.includes('custom_domain_json'),
            release_tables: tables,
            get_me_live_order_count: count
          }));
          if (columns.includes('hosting_json') || columns.includes('custom_domain_json') || tables.length) {
            throw new Error('Production schema shows partial or out-of-ledger 0010 state; do not apply migration automatically.');
          }
          NODE

      - name: Upload schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghosttown-production-schema-${{ github.run_id }}
          path: github-production-schema
          retention-days: 14
