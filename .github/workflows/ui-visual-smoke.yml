name: Production Preflight Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - chore/production-release-gate

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: acceptance
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production credential names
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Inspect production D1 migration ledger
        shell: bash
        run: |
          mkdir -p github-production-preflight
          npx wrangler d1 migrations list DB --env production --remote \
            | tee github-production-preflight/d1-migrations.txt

      - name: Inspect production Worker versions
        shell: bash
        run: |
          npx wrangler versions list --env production --json \
            > github-production-preflight/versions.json
          node -e "const v=require('./github-production-preflight/versions.json'); console.log('VERSIONS='+JSON.stringify(v.slice(0,5).map(x=>({id:x.id||x.version_id,created_on:x.created_on,tag:x.tag,message:x.message}))))"

      - name: Inspect active production deployment
        shell: bash
        run: |
          npx wrangler deployments status --env production --json \
            > github-production-preflight/deployment.json
          node -e "const d=require('./github-production-preflight/deployment.json'); console.log('DEPLOYMENT='+JSON.stringify(d))"

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghosttown-production-preflight-${{ github.run_id }}
          path: github-production-preflight
          retention-days: 14
