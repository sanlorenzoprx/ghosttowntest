name = "lit-ghost-town-api"
main = "src/api/index.ts"
compatibility_date = "2024-01-01"

[env.production]
routes = [
  { pattern = "api.ghosttowntest.com", custom_domain = true }
]

[env.production.vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
ACTION_PLAN_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GEMINI_RESEARCH_MODEL = "gemini-2.5-flash"
GOOGLE_SEARCH_GROUNDING_ENABLED = "false"
FRONTEND_URL = "https://ghosttowntest.com"

[[env.production.kv_namespaces]]
binding = "KV"
id = "289662c8981d421ba85a7ca588640650"

[env.production.ai]
binding = "AI"

[[env.production.r2_buckets]]
binding = "VIDEOS"
bucket_name = "ghosttowntest-public-videos"

# Launch Blueprint v2 remains fail-closed until a private D1 database and
# private R2 bucket are created and the production bindings below are enabled.
# Never point BLUEPRINTS at the public video bucket.
#
# [[env.production.d1_databases]]
# binding = "DB"
# database_name = "ghosttowntest-blueprints"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
# migrations_dir = "migrations"
#
# [[env.production.r2_buckets]]
# binding = "BLUEPRINTS"
# bucket_name = "ghosttowntest-private-blueprints"

[env.development.vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
ACTION_PLAN_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GEMINI_RESEARCH_MODEL = "gemini-2.5-flash"
GOOGLE_SEARCH_GROUNDING_ENABLED = "false"
FRONTEND_URL = "http://127.0.0.1:5300"
JWT_SECRET = "dev-secret-key-change-in-production"
STRIPE_SECRET_KEY = "sk_test_..."
STRIPE_PRICE_ID = "price_..."
STRIPE_PAID_TEST_PRICE_ID = "price_..."
STRIPE_30_DAY_PLAN_PRICE_ID = "price_..."
STRIPE_WEBHOOK_SECRET = "whsec_..."

[[env.development.kv_namespaces]]
binding = "KV"
id = "lit-kv-preview"

[env.development.ai]
binding = "AI"

[[kv_namespaces]]
binding = "KV"
id = "lit-kv-namespace"
preview_id = "lit-kv-preview"

[ai]
binding = "AI"
