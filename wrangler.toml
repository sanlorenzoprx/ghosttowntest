name = "lit-ghost-town-api"
main = "src/api/worker.ts"
compatibility_date = "2024-01-01"

[env.production]
routes = [
  { pattern = "api.ghosttowntest.com", custom_domain = true }
]

[env.production.vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
ACTION_PLAN_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GEMINI_RESEARCH_MODEL = "gemini-2.5-flash"
GEMINI_GOOGLE_SEARCH_MODEL = "gemini-2.5-flash"
DISTRIBUTION_FOOTPRINT_ENABLED = "false"
DISTRIBUTION_FOOTPRINT_BATCH_SIZE = "3"
FRONTEND_URL = "https://ghosttowntest.com"

[[env.production.kv_namespaces]]
binding = "KV"
id = "289662c8981d421ba85a7ca588640650"

[env.production.ai]
binding = "AI"

[[env.production.r2_buckets]]
binding = "VIDEOS"
bucket_name = "ghosttowntest-public-videos"

# Launch Blueprint v2 remains fail-closed until the owner creates the private
# storage resources, enables the Workflow binding, and configures provider
# secrets. Never point BLUEPRINTS at the public video bucket.
#
# [[env.production.d1_databases]]
# binding = "DB"
# database_name = "ghosttowntest-blueprints"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
# migrations_dir = "migrations"
#
# [[env.production.r2_buckets]]
# binding = "BLUEPRINTS"
# bucket_name = "ghosttowntest-private-blueprints"
#
# [[env.production.workflows]]
# binding = "LAUNCH_BLUEPRINT_WORKFLOW"
# name = "ghosttown-launch-blueprint"
# class_name = "LaunchBlueprintWorkflow"
#
# Required production secrets/configuration:
# GEMINI_API_KEY
# DATAFORSEO_LOGIN
# DATAFORSEO_PASSWORD
# PODCAST_INDEX_API_KEY
# PODCAST_INDEX_API_SECRET
# YOUTUBE_API_KEY
# INTERNAL_RESEARCH_OWNER_EMAILS

[env.development.vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
ACTION_PLAN_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GEMINI_RESEARCH_MODEL = "gemini-2.5-flash"
GEMINI_GOOGLE_SEARCH_MODEL = "gemini-2.5-flash"
DISTRIBUTION_FOOTPRINT_ENABLED = "false"
DISTRIBUTION_FOOTPRINT_BATCH_SIZE = "3"
INTERNAL_RESEARCH_OWNER_EMAILS = "owner@example.com"
FRONTEND_URL = "http://127.0.0.1:5300"
JWT_SECRET = "dev-secret-key-change-in-production"
STRIPE_SECRET_KEY = "sk_test_..."
STRIPE_PRICE_ID = "price_..."
STRIPE_PAID_TEST_PRICE_ID = "price_..."
STRIPE_30_DAY_PLAN_PRICE_ID = "price_..."
STRIPE_WEBHOOK_SECRET = "whsec_..."

[[env.development.kv_namespaces]]
binding = "KV"
id = "lit-kv-preview"

[env.development.ai]
binding = "AI"

[[kv_namespaces]]
binding = "KV"
id = "lit-kv-namespace"
preview_id = "lit-kv-preview"

[ai]
binding = "AI"
